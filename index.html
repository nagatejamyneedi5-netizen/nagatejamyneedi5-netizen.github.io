<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nagateja Myneedi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: #1e293b;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      text-align: center;
    }
    h1 {
      font-size: 2.2rem;
      color: #38bdf8;
      margin-bottom: 10px;
    }
    p {
      color: #94a3b8;
      font-size: 1.1rem;
      margin-bottom: 25px;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      transition: background 0.3s ease;
    }
    .btn:hover {
      background-color: #0284c7;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Nagateja Myneedi</h1>
    <p>Welcome to my personal site hosted on GitHub Pages!</p>
    <a href="https://github.com/nagatejamyneedi5-netizen" target="_blank" class="btn">View My GitHub</a>
  </div>
</body>
</html>
